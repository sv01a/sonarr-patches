services:
  sonarr:
    image: ghcr.io/<YOUR_GITHUB_USERNAME>/sonarr-patches:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Moscow
    volumes:
      - /path/to/sonarr/data:/config
      - /path/to/tvseries:/tv
      - /path/to/downloaded:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped
