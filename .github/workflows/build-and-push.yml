name: Build and Publish Patched Sonarr v5 Docker Image

on:
  push:
    branches:
      - v5
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      sonarr_version:
        description: 'Upstream Sonarr v5 git tag or branch (e.g. v5-develop)'
        required: true
        default: 'v5-develop'
        type: string
      base_image:
        description: 'Base image from LinuxServer'
        required: true
        default: 'lscr.io/linuxserver/sonarr:develop'
        type: string
      push_image:
        description: 'Push image to GHCR'
        required: true
        default: true
        type: boolean
  schedule:
    # Run every Sunday at 03:00 UTC
    - cron: '0 3 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Sonarr version
        id: vars
        run: |
          VERSION="${{ github.event.inputs.sonarr_version || 'v5-develop' }}"
          BASE="${{ github.event.inputs.base_image || 'lscr.io/linuxserver/sonarr:develop' }}"
          echo "sonarr_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "base_image=${BASE}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v5
            type=raw,value=v5-latest
            type=raw,value=develop
            type=raw,value=${{ steps.vars.outputs.sonarr_version }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SONARR_VERSION=${{ steps.vars.outputs.sonarr_version }}
            BASE_IMAGE=${{ steps.vars.outputs.base_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
