name: Build and Publish Patched Sonarr v4 Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      sonarr_version:
        description: 'Upstream Sonarr git tag or branch to build (e.g. latest, main, v4.0.19.2979)'
        required: true
        default: 'latest'
        type: string
      base_image:
        description: 'Base image from LinuxServer'
        required: true
        default: 'lscr.io/linuxserver/sonarr:latest'
        type: string
      push_image:
        description: 'Push image to GHCR'
        required: true
        default: true
        type: boolean
  schedule:
    # Check upstream Sonarr releases every 6 hours
    - cron: '0 */6 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Upstream Sonarr Version
        id: resolve_ver
        run: |
          INPUT_VER="${{ github.event.inputs.sonarr_version || 'latest' }}"
          if [ "$INPUT_VER" = "latest" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            UPSTREAM_TAG=$(curl -s "https://api.github.com/repos/Sonarr/Sonarr/releases/latest" | jq -r '.tag_name // empty')
            if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
              UPSTREAM_TAG="main"
            fi
            RESOLVED_VER="$UPSTREAM_TAG"
          else
            RESOLVED_VER="$INPUT_VER"
          fi
          
          echo "Resolved Sonarr version: $RESOLVED_VER"
          echo "sonarr_version=${RESOLVED_VER}" >> $GITHUB_OUTPUT
          echo "base_image=${{ github.event.inputs.base_image || 'lscr.io/linuxserver/sonarr:latest' }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=raw,value=${{ steps.resolve_ver.outputs.sonarr_version }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SONARR_VERSION=${{ steps.resolve_ver.outputs.sonarr_version }}
            BASE_IMAGE=${{ steps.resolve_ver.outputs.base_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
