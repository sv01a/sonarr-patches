name: Build and Publish Patched Sonarr v5 Docker Image

on:
  push:
    branches:
      - v5
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      sonarr_version:
        description: 'Upstream Sonarr v5 git tag or branch (e.g. v5-develop)'
        required: true
        default: 'v5-develop'
        type: string
      base_image:
        description: 'Base image from LinuxServer'
        required: true
        default: 'lscr.io/linuxserver/sonarr:develop'
        type: string
      push_image:
        description: 'Push image to GHCR'
        required: true
        default: true
        type: boolean
  schedule:
    # Check upstream Sonarr v5 branch updates every 6 hours
    - cron: '0 */6 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Upstream Sonarr v5 Version
        id: resolve_ver
        run: |
          TARGET_BRANCH="${{ github.event.inputs.sonarr_version || 'v5-develop' }}"
          UPSTREAM_SHA=$(git ls-remote https://github.com/Sonarr/Sonarr.git "refs/heads/${TARGET_BRANCH}" | awk '{print substr($1,1,7)}')
          
          echo "Upstream ${TARGET_BRANCH} commit SHA: ${UPSTREAM_SHA:-latest}"
          echo "sonarr_version=${TARGET_BRANCH}" >> $GITHUB_OUTPUT
          echo "upstream_sha=${UPSTREAM_SHA:-latest}" >> $GITHUB_OUTPUT
          echo "base_image=${{ github.event.inputs.base_image || 'lscr.io/linuxserver/sonarr:develop' }}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v5
            type=raw,value=v5-latest
            type=raw,value=develop
            type=raw,value=v5-${{ steps.resolve_ver.outputs.upstream_sha }}
            type=raw,value=${{ steps.resolve_ver.outputs.sonarr_version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SONARR_VERSION=${{ steps.resolve_ver.outputs.sonarr_version }}
            BASE_IMAGE=${{ steps.resolve_ver.outputs.base_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
